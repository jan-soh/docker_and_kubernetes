# Note: this will not take the name defined in each compose file into account
include:
  - notebooks-backend/compose.yaml
  - notes-backend/compose.yaml

services:
  reverse-proxy:
    image: nginx:1.27.0
    volumes:
      - type: bind
        source: ./reverse-proxy/nginx.conf
        target: /etc/nginx/nginx.conf
    ports:
      - 8081:80
    networks:
      - notes-app-net
    depends_on:
      - notebooks
      - notes

networks:
  notes-app-net: