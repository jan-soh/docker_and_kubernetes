# Equivalent to the following imperative command:
# kubectl run nginx-pod --image=nginx:1.27.0 --port=80

apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - image: nginx:1.27.0-alpine
      name: nginx-container
      ports:
        - containerPort: 80

# Three dashes say: here comes a new resource definition
---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  labels:
    app: nginx
spec:
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
  selector:
    # this should match the pod's app label (could be multiple pods even)
    app: nginx